<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Veri Oku</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 30px; }
    .kutu { background: #f0f0f0; padding: 20px; border-radius: 8px; max-width: 400px; }
    .kutu p { margin: 8px 0; font-size: 18px; }
    button { margin-top: 20px; padding: 10px 20px; cursor: pointer; }
  </style>
</head>
<body>
  <h2>Kayıtlı Veri</h2>
  <div class="kutu">
    <p>🔢 <b>Veri:</b> <span id="veri">Yükleniyor...</span></p>
    <p>📅 <b>Tarih:</b> <span id="tarih">Yükleniyor...</span></p>
  </div>


  <script>
    const MASTER_KEY = '$2a$10$YOLU8g9onIHxClZVX2xWR.ipjfBUz.2Z2yuAUTlBkPbMmSmMWa966';
    const BIN_ID     = '69e8873b856a6821895d94cf';

    function yukle() {
      fetch('https://api.jsonbin.io/v3/b/' + BIN_ID + '/latest', {
        headers: {
          'X-Master-Key': MASTER_KEY
        }
      })
      .then(res => res.json())
      .then(result => {
        let d = result.record || result;
        document.getElementById('veri').textContent  = d.veri  || '-';
        document.getElementById('tarih').textContent = d.tarih || '-';
      })
      .catch(err => {
        document.getElementById('veri').textContent  = 'Hata!';
        document.getElementById('tarih').textContent = err.message;
      });
    }

    yukle();
  </script>
</body>
</html>
