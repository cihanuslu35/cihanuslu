<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Veri Oku</title>
</head>
<body>
<pre id="log">Yükleniyor...</pre>

<script>
// ==== AYARLAR - kendi bilgilerinle değiştir ====
const BIN_ID  = "6aa3c80eac6210605abff9ea";       // veriyaz_jsonbin.html'de kullandığın aynı bin ID
const API_KEY = "$2a$10$hz4mh1uHsae.9gMaNqP7p.IMKgukU4Us7CMx9ebEX8HwdRaMpUoYa";      // aynı hesabın X-Master-Key'i (veya sadece okuma yetkili bir Access Key)
// ================================================

const log = document.getElementById("log");
oku();

async function oku() {
  const apiUrl = `https://api.jsonbin.io/v3/b/${BIN_ID}/latest`;

  try {
    const resp = await fetch(apiUrl, {
      headers: { "X-Master-Key": API_KEY }
    });

    const data = await resp.json();

    if (resp.ok) {
      const kayit = data.record;
      log.textContent = "veri=" + kayit.veri + "\ntarih=" + kayit.tarih;
    } else {
      log.textContent = "Hata: " + (data.message || JSON.stringify(data));
    }
  } catch (err) {
    log.textContent = "İstek hatası: " + err.message;
  }
}
</script>
</body>
</html>
