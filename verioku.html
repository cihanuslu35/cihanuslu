<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Veri Oku</title>
</head>
<body>
<pre id="log">Yükleniyor...</pre>

<script>
// BIN_ID ve MASTER_KEY artık api_keys.json dosyasından okunuyor (aşağıda)

const log = document.getElementById("log");
oku();

async function oku() {
  let BIN_ID, MASTER_KEY;
  try {
    const keysResp = await fetch("./api_keys.json");
    const keys = await keysResp.json();
    BIN_ID = keys.BIN_ID;
    MASTER_KEY = keys.MASTER_KEY;
  } catch (err) {
    log.textContent = "api_keys.json okunamadı: " + err.message;
    return;
  }

  const apiUrl = `https://api.jsonbin.io/v3/b/${BIN_ID}/latest`;

  try {
    const resp = await fetch(apiUrl, {
      headers: { "X-Master-Key": MASTER_KEY }
    });

    const data = await resp.json();

    if (resp.ok) {
      const kayit = data.record;
      log.textContent = "veri=" + kayit.veri + "\ntarih=" + kayit.tarih;
    } else {
      log.textContent = "Hata: " + (data.message || JSON.stringify(data));
    }
  } catch (err) {
    log.textContent = "İstek hatası: " + err.message;
  }
}
</script>
</body>
</html>
