<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Veri Oku</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 30px;
      background: #fff;
    }
    .kutu {
      background: #f0f0f0;
      padding: 20px;
      border-radius: 8px;
      max-width: 400px;
    }
    .kutu p { margin: 8px 0; font-size: 18px; }
    button {
      margin-top: 20px;
      padding: 10px 20px;
      cursor: pointer;
      font-size: 15px;
    }
    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 3px solid #ccc;
      border-top-color: #333;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #son-guncelleme { margin-top: 10px; font-size: 12px; color: #888; }
  </style>
</head>
<body>
  <h2>Sunucu Odası Sıcaklık</h2>
  <div class="kutu">
    <p>🔢 <b>Veri:</b> <span id="veri"><span class="spinner"></span></span>°C</p>
    <p>📅 <b>Tarih:</b> <span id="tarih"><span class="spinner"></span></span></p>
  </div>
 
  <div id="son-guncelleme"></div>

  <script>
    const MASTER_KEY = '$2a$10$YOLU8g9onIHxClZVX2xWR.ipjfBUz.2Z2yuAUTlBkPbMmSmMWa966';
    const BIN_ID     = '69e8873b856a6821895d94cf';

    function spinner() {
      return '<span class="spinner"></span>';
    }

    function yukle() {
      document.getElementById('veri').innerHTML  = spinner();
      document.getElementById('tarih').innerHTML = spinner();

      // cache önlemek için timestamp ekle
      var url = 'https://api.jsonbin.io/v3/b/' + BIN_ID + '/latest?t=' + Date.now();

      fetch(url, {
        headers: { 'X-Master-Key': MASTER_KEY },
        cache: 'no-store'
      })
      .then(function(res) { return res.json(); })
      .then(function(result) {
        var d = result.record || result;
        document.getElementById('veri').textContent  = d.veri  || '-';
        document.getElementById('tarih').textContent = d.tarih || '-';
      
      })
      .catch(function(err) {
        document.getElementById('veri').textContent  = 'Hata!';
        document.getElementById('tarih').textContent = err.message;
      });
    }

    yukle();
  </script>
</body>
</html>
