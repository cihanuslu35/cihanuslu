<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Veri Yazılıyor...</title>
</head>
<body>
  <p id="durum">İşlem yapılıyor...</p>

  <script>
    const API_KEY = '$2a$10$w70Iqm3C3yxbiY55FHzt2etsvRwTp3Feb2TaEFqI0l9e5O8SLBzKi';
    const BIN_ID  = '69e87ace856a6821895d56ab';

    const params = new URLSearchParams(window.location.search);
    const veri   = params.get('veri')  || '';
    const tarih  = params.get('tarih') || '';

    const data = { veri: veri, tarih: tarih };

    fetch('https://api.jsonbin.io/v3/b/' + BIN_ID, {
      method: 'PUT',
      headers: {
        'Content-Type': 'application/json',
        'X-Master-Key': API_KEY,
        'X-Access-Key': API_KEY
      },
      body: JSON.stringify(data)
    })
    .then(res => res.json())
    .then(result => {
      if (result.record || result.metadata) {
        document.getElementById('durum').innerHTML =
          '✅ Veri başarıyla kaydedildi.<br><br>' +
          '<b>veri:</b> ' + veri + '<br>' +
          '<b>tarih:</b> ' + tarih;
      } else {
        document.getElementById('durum').innerHTML =
          '⚠️ Yanıt: ' + JSON.stringify(result);
      }
    })
    .catch(err => {
      document.getElementById('durum').innerHTML =
        '❌ Hata oluştu: ' + err.message;
    });
  </script>
</body>
</html>
