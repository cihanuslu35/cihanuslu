<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Veri Yaz</title>
</head>
<body>
<pre id="log">İşleniyor...</pre>

<script>
// ==== AYARLAR - kendi bilgilerinle değiştir ====
const GUVENLIK_ANAHTARI = "KENDI_GIZLI_ANAHTARIN"; // URL'deki &key=... ile eşleşmesi gereken kendi belirlediğin şifre
// BIN_ID ve MASTER_KEY artık api_keys.json dosyasından okunuyor (aşağıda)
// ================================================

const params = new URLSearchParams(window.location.search);
const veriDeger = params.get("veri");
const tarih     = params.get("tarih");
const key       = params.get("key");

const log = document.getElementById("log");

if (key !== GUVENLIK_ANAHTARI) {
  log.textContent = "Hata: geçersiz veya eksik key.";
} else if (veriDeger === null || tarih === null) {
  log.textContent = "Hata: querystring eksik. Örnek kullanım:\nveriyaz_jsonbin.html?veri=25&tarih=11.09.2026%2014:33&key=...";
} else {
  yaz();
}

async function yaz() {
  let BIN_ID, MASTER_KEY;
  try {
    const keysResp = await fetch("./api_keys.json");
    const keys = await keysResp.json();
    BIN_ID = keys.BIN_ID;
    MASTER_KEY = keys.MASTER_KEY;
  } catch (err) {
    log.textContent = "api_keys.json okunamadı: " + err.message;
    return;
  }

  const gonderilecek = { veri: veriDeger, tarih: tarih };
  const apiUrl = `https://api.jsonbin.io/v3/b/${BIN_ID}`;

  try {
    const resp = await fetch(apiUrl, {
      method: "PUT",
      headers: {
        "Content-Type": "application/json",
        "X-Master-Key": MASTER_KEY
      },
      body: JSON.stringify(gonderilecek)
    });

    const data = await resp.json();

    if (resp.ok) {
      log.textContent = "Yazıldı:\nveri=" + veriDeger + "\ntarih=" + tarih;
    } else {
      log.textContent = "Hata: " + (data.message || JSON.stringify(data));
    }
  } catch (err) {
    log.textContent = "İstek hatası: " + err.message;
  }
}
</script>
</body>
</html>
