<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Veri Yaz</title>
</head>
<body>
<pre id="log">İşleniyor...</pre>

<script>
// ==== AYARLAR - kendi bilgilerinle değiştir ====
const BIN_ID     = "6aa3c80eac6210605abff9ea";        // jsonbin.io'da oluşturacağın yeni bin'in ID'si
const MASTER_KEY = "$2a$10$hz4mh1uHsae.9gMaNqP7p.IMKgukU4Us7CMx9ebEX8HwdRaMpUoYa";    // sıcaklık projesinde kullandığın JSONBin API key (X-Master-Key)
const GUVENLIK_ANAHTARI = "saguvege"; // URL'deki &key=... ile eşleşmesi gereken kendi belirlediğin şifre
// ================================================

const params = new URLSearchParams(window.location.search);
const veriDeger = params.get("veri");
const tarih     = params.get("tarih");
const key       = params.get("key");

const log = document.getElementById("log");

if (key !== GUVENLIK_ANAHTARI) {
  log.textContent = "Hata: geçersiz veya eksik key.";
} else if (veriDeger === null || tarih === null) {
  log.textContent = "Hata: querystring eksik. Örnek kullanım:\nveriyaz_jsonbin.html?veri=25&tarih=11.09.2026&key=...";
} else {
  yaz();
}

async function yaz() {
  const gonderilecek = { veri: veriDeger, tarih: tarih };
  const apiUrl = `https://api.jsonbin.io/v3/b/${BIN_ID}`;

  try {
    const resp = await fetch(apiUrl, {
      method: "PUT",
      headers: {
        "Content-Type": "application/json",
        "X-Master-Key": MASTER_KEY
      },
      body: JSON.stringify(gonderilecek)
    });

    const data = await resp.json();

    if (resp.ok) {
      log.textContent = "Yazıldı:\nveri=" + veriDeger + "\ntarih=" + tarih;
    } else {
      log.textContent = "Hata: " + (data.message || JSON.stringify(data));
    }
  } catch (err) {
    log.textContent = "İstek hatası: " + err.message;
  }
}
</script>
</body>
</html>
