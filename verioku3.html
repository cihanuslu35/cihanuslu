<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Veri Oku</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 30px; }
    .kutu { background: #f0f0f0; padding: 20px; border-radius: 8px; max-width: 400px; }
    .kutu p { margin: 8px 0; font-size: 18px; }
    button { margin-top: 20px; padding: 10px 20px; cursor: pointer; }
    #ham { margin-top: 20px; font-size: 12px; color: #666; word-break: break-all; }
  </style>
</head>
<body>
  <h2>Kayıtlı Veri</h2>
  <div class="kutu">
    <p>🔢 <b>Veri:</b> <span id="veri">Yükleniyor...</span></p>
    <p>📅 <b>Tarih:</b> <span id="tarih">Yükleniyor...</span></p>
  </div>
  <button onclick="yukle()">🔄 Yenile</button>
  <div id="ham"></div>

  <script>
    const API_KEY = '$2a$10$w70Iqm3C3yxbiY55FHzt2etsvRwTp3Feb2TaEFqI0l9e5O8SLBzKi';
    const BIN_ID  = '69e87ace856a6821895d56ab';

    function yukle() {
      fetch('https://api.jsonbin.io/v3/b/' + BIN_ID + '/latest', {
        headers: {
          'X-Master-Key': API_KEY,
          'X-Access-Key': API_KEY
        }
      })
      .then(res => res.json())
      .then(result => {
        document.getElementById('ham').textContent = 'Ham yanıt: ' + JSON.stringify(result);

        let d = null;
        if (result && result.record) {
          d = result.record;
        } else if (result && result.veri !== undefined) {
          d = result;
        }

        if (d) {
          document.getElementById('veri').textContent  = d.veri  !== undefined ? d.veri  : '-';
          document.getElementById('tarih').textContent = d.tarih !== undefined ? d.tarih : '-';
        } else {
          document.getElementById('veri').textContent  = '?';
          document.getElementById('tarih').textContent = '?';
        }
      })
      .catch(err => {
        document.getElementById('veri').textContent  = 'Hata!';
        document.getElementById('tarih').textContent = err.message;
        document.getElementById('ham').textContent   = 'Catch hatası: ' + err.message;
      });
    }

    yukle();
  </script>
</body>
</html>
