<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cihan Uslu — Developer</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #070b12;
      --surface: #0d1525;
      --border:  #162036;
      --accent:  #3b82f6;
      --accent2: #06b6d4;
      --text:    #dde4f0;
      --muted:   #4a607f;
      --mono:    'JetBrains Mono', monospace;
      --sans:    'Syne', sans-serif;
    }

    html, body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: var(--mono);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* arka plan grid */
    .bg-grid {
      position: fixed; inset: 0; z-index: 0;
      background-image:
        linear-gradient(rgba(59,130,246,.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(59,130,246,.05) 1px, transparent 1px);
      background-size: 44px 44px;
      animation: drift 25s linear infinite;
    }
    @keyframes drift { to { background-position: 44px 44px; } }

    /* parlayan küreler */
    .orb { position: fixed; border-radius: 50%; filter: blur(100px); opacity: .15; pointer-events: none; z-index: 0; }
    .orb-1 { width: 480px; height: 480px; background: #1d4ed8; top: -180px; left: -120px; animation: f1 14s ease-in-out infinite; }
    .orb-2 { width: 380px; height: 380px; background: #0e7490; bottom: -120px; right: -100px; animation: f2 17s ease-in-out infinite; }
    @keyframes f1 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(35px,25px)} }
    @keyframes f2 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(-25px,-18px)} }

    /* kart */
    .card {
      position: relative; z-index: 10;
      width: min(460px, 92vw);
      background: rgba(13,21,37,.82);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 52px 44px;
      backdrop-filter: blur(28px);
      box-shadow: 0 0 0 1px rgba(59,130,246,.07), 0 40px 80px rgba(0,0,0,.55);
      animation: cardIn .7s cubic-bezier(.16,1,.3,1) both;
      text-align: center;
    }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(28px) scale(.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* üst chip */
    .chip {
      display: inline-flex; align-items: center; gap: 7px;
      font-size: 10px; letter-spacing: .12em; text-transform: uppercase;
      color: var(--accent2);
      background: rgba(6,182,212,.08);
      border: 1px solid rgba(6,182,212,.18);
      border-radius: 99px; padding: 5px 14px;
      margin-bottom: 32px;
    }
    .chip-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--accent2);
      animation: blink 2s ease-in-out infinite;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }

    /* avatar */
    .avatar-wrap { position: relative; display: inline-block; margin-bottom: 24px; }
    .avatar {
      width: 96px; height: 96px; border-radius: 50%;
      background: linear-gradient(135deg, #1e3a5f, #0f2240);
      border: 2px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-size: 38px;
      box-shadow: 0 0 0 5px rgba(59,130,246,.10);
    }
    .avatar-ring {
      position: absolute; inset: -7px; border-radius: 50%;
      border: 1px dashed rgba(59,130,246,.22);
      animation: spin 18s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* isim */
    h1 {
      font-family: var(--sans);
      font-size: 1.95rem; font-weight: 800;
      background: linear-gradient(120deg, #e2e8f0 30%, var(--accent2));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }

    /* ünvan */
    .title {
      font-size: 11px; letter-spacing: .15em; text-transform: uppercase;
      color: var(--accent); margin-bottom: 20px;
    }

    /* ayraç */
    .divider {
      height: 1px;
      background: linear-gradient(to right, transparent, var(--border), transparent);
      margin: 22px 0;
    }

    /* bio */
    .bio {
      font-size: 13px; line-height: 1.8;
      color: #7a94b8; margin-bottom: 30px;
    }

    /* skill etiketleri */
    .tags {
      display: flex; flex-wrap: wrap; gap: 8px;
      justify-content: center; margin-bottom: 36px;
    }
    .tag {
      font-size: 10px; letter-spacing: .07em;
      padding: 4px 12px; border-radius: 6px;
      background: rgba(59,130,246,.07);
      border: 1px solid rgba(59,130,246,.14);
      color: #60a5fa;
    }

    /* GitHub butonu */
    .btn-github {
      display: inline-flex; align-items: center; gap: 10px;
      text-decoration: none;
      background: linear-gradient(135deg, #1a2f55, #0f1e3a);
      border: 1px solid rgba(59,130,246,.3);
      color: var(--text);
      font-family: var(--mono);
      font-size: 13px; font-weight: 600;
      padding: 14px 30px; border-radius: 10px;
      transition: transform .2s, box-shadow .2s, border-color .2s;
      box-shadow: 0 4px 20px rgba(0,0,0,.3);
    }
    .btn-github:hover {
      transform: translateY(-2px);
      border-color: rgba(59,130,246,.6);
      box-shadow: 0 8px 32px rgba(59,130,246,.22);
    }

    /* alt not */
    .footer-note {
      margin-top: 28px;
      font-size: 10px; color: var(--muted); letter-spacing: .05em;
    }
  </style>
</head>
<body>

  <div class="bg-grid"></div>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <div class="card">

    <div class="chip">
      <span class="chip-dot"></span>
      Open to Opportunities
    </div>

    <div class="avatar-wrap">
      <div class="avatar">👨‍💻</div>
      <div class="avatar-ring"></div>
    </div>

    <h1>Cihan Uslu</h1>
    <p class="title">&lt; Software Developer /&gt;</p>

    <div class="divider"></div>

    <p class="bio">Yazılım geliştirme tutkusu ile masaüstü, mobil ve web uygulamaları üzerine çalışıyorum.</p>

    <div class="tags">
      <span class="tag">C#</span>
      <span class="tag">Swift</span>
      <span class="tag">Kotlin</span>
      <span class="tag">ASP.NET</span>
      <span class="tag">iOS</span>
      <span class="tag">Android</span>
      <span class="tag">Windows Forms</span>
    </div>

    <a class="btn-github" href="https://github.com/cihanuslu35" target="_blank" rel="noopener">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 .5C5.65.5.5 5.65.5 12c0 5.1 3.3 9.42 7.88 10.95.58.1.79-.25.79-.56v-2.1c-3.2.7-3.88-1.54-3.88-1.54-.52-1.33-1.28-1.68-1.28-1.68-1.05-.72.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.76 2.7 1.25 3.36.96.1-.75.4-1.25.73-1.54-2.55-.29-5.23-1.28-5.23-5.68 0-1.25.45-2.28 1.18-3.08-.12-.29-.51-1.46.11-3.04 0 0 .96-.31 3.15 1.18a10.9 10.9 0 0 1 2.87-.39c.97 0 1.95.13 2.87.39 2.18-1.49 3.14-1.18 3.14-1.18.63 1.58.24 2.75.12 3.04.74.8 1.18 1.83 1.18 3.08 0 4.41-2.69 5.38-5.25 5.66.41.36.78 1.06.78 2.13v3.17c0 .31.2.67.8.56C20.2 21.42 23.5 17.1 23.5 12 23.5 5.65 18.35.5 12 .5z"/>
      </svg>
      GitHub Profilim
    </a>

    <p class="footer-note" id="year-note"></p>
    <script>
      document.getElementById('year-note').textContent =
        '© ' + new Date().getFullYear() + ' Cihan Uslu';
    </script>

  </div>

</body>
</html>
