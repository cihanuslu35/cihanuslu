<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Veri Yazılıyor...</title>
</head>
<body>
  <p id="durum">İşlem yapılıyor...</p>

  <script>
    const MASTER_KEY = '$2a$10$YOLU8g9onIHxClZVX2xWR.ipjfBUz.2Z2yuAUTlBkPbMmSmMWa966';
    const BIN_ID     = '69e8873b856a6821895d94cf';

    const params = new URLSearchParams(window.location.search);
    const key    = params.get('key')   || '';
    const veri   = params.get('veri')  || '';
    const tarih  = params.get('tarih') || '';

    if (key !== 'saguvege') {
      document.getElementById('durum').innerHTML = '❌ Key hatalı!';
    } else {
      const data = { veri: veri, tarih: tarih };

      fetch('https://api.jsonbin.io/v3/b/' + BIN_ID, {
        method: 'PUT',
        headers: {
          'Content-Type': 'application/json',
          'X-Master-Key': MASTER_KEY
        },
        body: JSON.stringify(data)
      })
      .then(res => res.json())
      .then(result => {
        if (result.record || result.metadata) {
          document.getElementById('durum').innerHTML =
            '✅ Veri başarıyla kaydedildi.<br><br>' +
            '<b>veri:</b> ' + veri + '<br>' +
            '<b>tarih:</b> ' + tarih;
        } else {
          document.getElementById('durum').innerHTML =
            '⚠️ Yanıt: ' + JSON.stringify(result);
        }
      })
      .catch(err => {
        document.getElementById('durum').innerHTML =
          '❌ Hata oluştu: ' + err.message;
      });
    }
  </script>
</body>
</html>
